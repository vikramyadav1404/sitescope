# /etc/nginx/sites-available/vikramyadav.me
# Certbot adds the HTTPS (443) server block and certificate lines automatically.
server {
    listen 80;
    listen [::]:80;
    server_name vikramyadav.me www.vikramyadav.me;

    # send www to the bare domain
    if ($host = www.vikramyadav.me) {
        return 301 https://vikramyadav.me$request_uri;
    }

    client_max_body_size 1m;

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
